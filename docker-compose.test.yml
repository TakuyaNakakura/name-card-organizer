services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: name_card_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d name_card_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:local-test-only@postgres:5432/name_card_test
      DATABASE_MIGRATION_URL: postgres://postgres:local-test-only@postgres:5432/name_card_test
      TEST_DATABASE_URL: postgres://postgres:local-test-only@postgres:5432/name_card_test
      OCR_PROVIDER: mock
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: /tmp/name-card-test-uploads
    command:
      ["sh", "-c", "npm run db:migrate && npm test && npm run test:integration"]
