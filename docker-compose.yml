services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: name_card_organizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d name_card_organizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://postgres:postgres@postgres:5432/name_card_organizer}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ random characters)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      MOCK_OCR_TEXT: ${MOCK_OCR_TEXT:-Jane Doe\njane@example.com}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_DIR: /app/var/uploads
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_CREDENTIALS_JSON: ${GOOGLE_CLOUD_CREDENTIALS_JSON:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/var/uploads

  migrate:
    profiles: ["tools"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL_DOCKER:-postgres://postgres:postgres@postgres:5432/name_card_organizer}
    command: ["npm", "run", "db:migrate"]

  bootstrap:
    profiles: ["tools"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL_DOCKER:-postgres://postgres:postgres@postgres:5432/name_card_organizer}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      TEAM_NAME: ${TEAM_NAME:-共有名刺チーム}
    command: ["npm", "run", "team:bootstrap"]

volumes:
  postgres_data:
  uploads_data:
